<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE HUNK — Empowering Silent Voices</title>
<meta name="description" content="THE HUNK — Stories, voices, courage and inspiration.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap');

:root{
  --bg:#070707; --card:#101010; --text:#f4f1e8; --muted:#a7a39a;
  --gold:#d6ad55; --line:#262626; --max:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
.container{width:min(92%,var(--max));margin:auto}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:18px 0;background:linear-gradient(#070707ee,transparent);transition:.3s}
nav.scrolled{background:#070707f2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.nav-inner{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:2px}
.brand-mark{width:38px;height:38px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:13px}
.links{display:flex;gap:28px;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.links a{opacity:.8;transition:.2s}.links a:hover{color:var(--gold);opacity:1}
.menu{display:none;background:none;border:1px solid #333;color:white;border-radius:8px;padding:8px 11px}

/* HERO */
.hero{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 75% 35%,#8c6b2925,transparent 28%),
 linear-gradient(115deg,#050505 20%,#1110 60%);}
.hero:after{content:"";position:absolute;width:560px;height:560px;border:1px solid #d6ad5520;border-radius:50%;right:-170px;top:18%;box-shadow:0 0 0 60px #d6ad5508,0 0 0 120px #d6ad5504}
.hero-content{position:relative;z-index:2;padding-top:90px}
.kicker{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:5px;text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(58px,11vw,145px);line-height:.86;letter-spacing:-7px;font-weight:900;max-width:850px}
h1 span{color:var(--gold)}
.hero-copy{max-width:610px;margin:30px 0;color:#c3c0b7;font-size:18px}
.cta-row{display:flex;gap:13px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border:1px solid #444;border-radius:5px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.btn.primary{background:var(--gold);color:#090909;border-color:var(--gold)}
.btn:hover{transform:translateY(-2px);transition:.2s}
.scroll{position:absolute;bottom:28px;left:4%;font-size:10px;letter-spacing:3px;color:#777;writing-mode:vertical-rl}

/* SECTIONS */
section{padding:105px 0;border-top:1px solid var(--line)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:45px}
.eyebrow{color:var(--gold);font-size:11px;letter-spacing:4px;font-weight:800;text-transform:uppercase}
h2{font-family:"Playfair Display",serif;font-size:clamp(38px,6vw,72px);line-height:1.05}
.lead{max-width:470px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

/* CARDS */
.card{background:var(--card);border:1px solid var(--line);padding:26px;min-height:250px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:auto -30px -70px auto;width:180px;height:180px;border:1px solid #d6ad5518;border-radius:50%}
.number{font-size:12px;color:var(--gold);font-weight:800}
.card h3{font-family:"Playfair Display",serif;font-size:28px;margin:55px 0 8px}
.card p{color:var(--muted);font-size:14px}

/* FEATURE */
.feature{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.feature-main{min-height:450px;background:linear-gradient(145deg,#171717,#0b0b0b);border:1px solid var(--line);padding:42px;display:flex;flex-direction:column;justify-content:end}
.feature-main h3{font-size:clamp(35px,5vw,65px);line-height:1;margin:12px 0}
.feature-side{display:grid;gap:18px}
.mini{background:#101010;border:1px solid var(--line);padding:28px}
.mini h4{font-size:22px;margin:12px 0 5px}
.mini p{color:var(--muted);font-size:13px}

/* QUOTE */
.quote{padding:90px 0;text-align:center;background:#0a0a0a}
.quote blockquote{font-family:"Playfair Display",serif;font-size:clamp(28px,5vw,58px);max-width:900px;margin:auto;line-height:1.15}
.quote cite{display:block;color:var(--gold);font-size:11px;letter-spacing:3px;margin-top:25px;font-style:normal}

/* ABOUT / CONTACT */
.about{display:grid;grid-template-columns:1fr 1fr;gap:80px}
.about p{color:#b8b5ad;margin-top:20px;font-size:17px}
.manifesto{border-left:2px solid var(--gold);padding-left:25px}
.contact-box{border:1px solid var(--line);padding:35px;display:flex;justify-content:space-between;align-items:center;gap:30px}

/* FOOTER */
footer{padding:45px 0;color:#777;font-size:12px}
.footer-inner{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:25px}
.socials{display:flex;gap:18px}.socials a:hover{color:var(--gold)}

@media(max-width:800px){
 .links{display:none;position:absolute;top:72px;left:4%;right:4%;padding:20px;background:#0b0b0bf7;border:1px solid var(--line);flex-direction:column;gap:18px}
 .links.open{display:flex}.menu{display:block}
 h1{letter-spacing:-4px}
 .grid,.feature,.about{grid-template-columns:1fr}
 .section-head{display:block}.lead{margin-top:18px}
 .feature-main{min-height:380px}.about{gap:40px}
 .contact-box{display:block}.contact-box .btn{margin-top:20px}
 .footer-inner{display:block}.socials{margin-top:15px}
}

/* PREMIUM ABOUT PAGE */
.about-page{padding:110px 0 80px;background:#f4f0e8;color:#171515}
.about-page .container{max-width:1100px}
.about-hero{padding:20px 0 85px;border-bottom:1px solid #cfc6b7}
.about-page .eyebrow{color:#641f2b;letter-spacing:4px;font-weight:800;font-size:11px}
.about-hero h2{font-family:"Playfair Display",serif;font-size:clamp(42px,7vw,82px);line-height:.98;margin:20px 0 28px;letter-spacing:-2px}
.about-hero h2 span,.about-section h3,.about-promise h3{color:#641f2b}
.about-intro{font-size:20px;line-height:1.65;max-width:760px;color:#514c46}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#cfc6b7;margin:65px 0;background-color:#cfc6b7}
.about-section{background:#f4f0e8;padding:42px 38px;min-height:330px}
.about-num{font-size:11px;font-weight:800;color:#9b7b37;letter-spacing:2px;margin-bottom:50px}
.about-section h3{font-family:"Playfair Display",serif;font-size:30px;margin-bottom:18px;letter-spacing:.5px}
.about-section p{color:#514c46;margin:0 0 14px;font-size:15px;line-height:1.8}
.about-section strong{color:#641f2b}
.about-topics{font-size:14px!important;font-weight:700;color:#641f2b!important}
.vision-line{font-family:"Playfair Display",serif;font-size:21px!important;line-height:1.35!important;color:#641f2b!important}
.pillars{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.pillars span{border:1px solid #9b7b37;padding:7px 12px;font-size:10px;letter-spacing:1.5px;font-weight:800;color:#641f2b}
.about-manifesto{background:#171515;color:#f4f0e8;padding:75px 55px;margin:65px 0;text-align:center}.about-manifesto .eyebrow{color:#d6ad55}.about-manifesto blockquote{font-family:"Playfair Display",serif;font-size:clamp(28px,5vw,55px);line-height:1.1;margin:25px auto;max-width:900px}.about-manifesto p{max-width:720px;margin:auto;color:#c7c1b7;line-height:1.8}
.knowledge-universe{padding:25px 0 70px}.knowledge-universe h3{font-family:"Playfair Display",serif;color:#641f2b;font-size:clamp(32px,5vw,58px);margin:15px 0}.knowledge-universe>p{max-width:760px;color:#514c46;line-height:1.8}.learning-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:35px 0}.learning-cards div{border:1px solid #cfc6b7;padding:25px;background:#eee9df}.learning-cards b{display:block;color:#641f2b;font-family:"Playfair Display",serif;font-size:22px;margin-bottom:8px}.learning-cards span{font-size:12px;color:#69635b}.goal{margin-top:30px!important;color:#641f2b!important;font-family:"Playfair Display",serif;font-size:20px}.about-promise{border-top:1px solid #cfc6b7;border-bottom:1px solid #cfc6b7;padding:65px 0}.about-promise h3{font-family:"Playfair Display",serif;font-size:clamp(28px,4vw,50px);line-height:1.15;margin-top:20px}.about-welcome{text-align:center;padding:90px 0 30px}.about-welcome h3{font-family:"Playfair Display",serif;color:#641f2b;font-size:clamp(32px,5vw,62px);line-height:1.05;margin:20px 0}.about-welcome p{font-weight:900;letter-spacing:5px;margin-top:40px}.about-welcome span{font-size:11px;color:#9b7b37;letter-spacing:2px;font-weight:800}
@media(max-width:800px){.about-grid{grid-template-columns:1fr}.about-section{padding:35px 25px;min-height:auto}.about-manifesto{padding:55px 25px}.learning-cards{grid-template-columns:1fr}.about-hero{padding-bottom:55px}}

.about-photo{width:100%;height:250px;object-fit:cover;display:block;filter:saturate(.88) contrast(1.03)}
.about-section{padding:0 0 34px;overflow:hidden}
.about-section .about-copy{padding:30px 34px 0}
.about-hero-photo{width:100%;height:min(58vw,520px);object-fit:cover;display:block;margin-top:38px;filter:brightness(.78) saturate(.85)}
.about-hero-photo-wrap{position:relative;overflow:hidden;background:#171515}
.about-hero-photo-wrap:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(23,21,21,.72) 100%)}
.about-hero-photo-label{position:absolute;left:30px;bottom:25px;z-index:2;color:#f4f0e8;font-size:11px;letter-spacing:3px;font-weight:800}
@media(max-width:800px){.about-photo{height:230px}.about-section .about-copy{padding:28px 25px 0}.about-hero-photo{height:300px}}
</style>
</head>
